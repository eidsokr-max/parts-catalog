<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كتالوج القطع</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>كتالوج القطع والمعدات</h1><button id="ownerBtn" class="btn sec" type="button">دخول المالك</button></header>
<main>
  <div id="cfgWarn" class="note" hidden>لسه ماتحطتش إعدادات Firebase في firebase-config.js</div>
  <input id="q" class="inp" placeholder="ابحث باسم القطعة أو رقمها">
  <select id="deptFilter" class="inp"></select>
  <div id="chips" class="chips"></div>
  <div id="msg" class="msg" hidden role="status"></div>
  <div id="grid" class="grid"></div>
  <p id="empty" class="hint" hidden>مفيش نتائج.</p>

  <section id="login" class="panel" hidden>
    <h2>دخول المالك</h2>
    <input id="email" class="inp" type="email" placeholder="الإيميل" autocomplete="username">
    <input id="pass" class="inp" type="password" placeholder="الباسورد" autocomplete="current-password">
    <div class="row"><button id="doLogin" class="btn" type="button">دخول</button><button id="cancelLogin" class="btn sec" type="button">إلغاء</button></div>
    <p id="loginErr" class="err"></p>
  </section>

  <section id="owner" class="panel" hidden>
    <div class="row"><h2>وضع المالك</h2><button id="logout" class="btn sec" type="button">خروج</button></div>
    <h3>إضافة قطعة</h3>
    <p class="hint">صوّر ٣ أو ٤ لقطات من اتجاهات مختلفة، اضغط دمج، املأ البيانات واحفظ.</p>
    <input id="cam" type="file" accept="image/*" capture="environment" hidden>
    <input id="pick" type="file" accept="image/*" multiple hidden>
    <div id="shots" class="shots"></div>
    <div class="row">
      <button id="shoot" class="btn" type="button">📷 صوّر لقطة</button>
      <button id="gallery" class="btn sec" type="button">من المعرض</button>
      <button id="clear" class="btn sec" type="button">مسح اللقطات</button>
      <button id="merge" class="btn" type="button" disabled>دمج في صورة واحدة</button>
    </div>
    <img id="merged" class="merged" alt="الصورة المدمجة" hidden>
    <input id="fname" class="inp" placeholder="اسم القطعة">
    <input id="fcode" class="inp" placeholder="رقم القطعة (اختياري)">
    <input id="fcat" class="inp" list="cats" placeholder="التصنيف">
    <datalist id="cats"></datalist>
    <select id="fdept" class="inp"></select>
    <input id="fmodel" class="inp" placeholder="الموديل (اختياري)">
    <input id="floc" class="inp" placeholder="مكان القطعة في المخزن (اختياري)">
    <textarea id="fnotes" class="inp" rows="2" placeholder="ملاحظات / وصف (اختياري)"></textarea>
    <input id="fqty" class="inp" inputmode="numeric" placeholder="الكمية" value="1">
    <input id="fmin" class="inp" inputmode="numeric" placeholder="حد التنبيه (ينبه لما الكمية توصله أو تقل)" value="2">
    <button id="save" class="btn wide" type="button" disabled>حفظ القطعة</button>
    <p id="saveErr" class="err"></p>
    <h3>تنبيه المخزون</h3>
    <div id="lowList"></div>
    <h3>تصدير</h3>
    <div class="row"><button id="expParts" class="btn sec" type="button">تصدير القطع (Excel)</button><button id="expReqs" class="btn sec" type="button">تصدير الطلبات (Excel)</button></div>
    <h3>الطلبات</h3>
    <div id="reqs"></div>
  </section>
</main>

<div id="modal" class="modal" hidden><div class="mbox"><img id="mimg" alt=""><div id="mname" class="name"></div><button id="mclose" class="btn sec" type="button">إغلاق</button></div></div>
<div id="reqModal" class="modal" hidden><div class="mbox">
  <div class="name" id="rtitle"></div>
  <input id="rname" class="inp" placeholder="اسمك" maxlength="60">
  <select id="rdept" class="inp"></select>
  <input id="rphone" class="inp" placeholder="رقم الموبايل أو الإيميل (اختياري)" maxlength="60">
  <div class="row"><button id="rsend" class="btn" type="button">إرسال الطلب</button><button id="rcancel" class="btn sec" type="button">إلغاء</button></div>
  <p id="rerr" class="err"></p>
</div></div>
<div id="editModal" class="modal" hidden><div class="mbox">
  <div class="name">تعديل القطعة</div>
  <input id="ename" class="inp" placeholder="اسم القطعة">
  <input id="ecode" class="inp" placeholder="رقم القطعة">
  <input id="ecat" class="inp" list="cats" placeholder="التصنيف">
  <select id="edept" class="inp"></select>
  <input id="emodel" class="inp" placeholder="الموديل">
  <input id="eloc" class="inp" placeholder="مكان القطعة في المخزن">
  <textarea id="enotes" class="inp" rows="2" placeholder="ملاحظات / وصف"></textarea>
  <input id="eqty" class="inp" inputmode="numeric" placeholder="الكمية">
  <input id="emin" class="inp" inputmode="numeric" placeholder="حد التنبيه">
  <div class="row"><button id="esave" class="btn" type="button">حفظ التعديل</button><button id="ecancel" class="btn sec" type="button">إلغاء</button></div>
  <p id="eerr" class="err"></p>
</div></div>
<div id="camModal" class="modal cammodal" hidden><div class="camwrap">
  <video id="live" playsinline muted autoplay></video><div id="camFlash" class="camflash"></div>
  <div class="camcount" id="camCount">0 / 4</div>
  <div class="camrow"><button id="camCancel" class="btn sec camb" type="button">إلغاء</button><button id="snap" class="snap" type="button" aria-label="التقاط"></button><button id="camDone" class="btn camb" type="button">تم</button></div>
</div></div>
<script type="module" src="app.js"></script>
</body>
</html>
